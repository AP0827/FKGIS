[system]
gpu_allocator = null

[nlp]
lang = "en"
pipeline = ["transformer", "entity_ruler", "ner", "llm_rel"]
batch_size = 1000
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null

[nlp.tokenizer]
@tokenizers = "spacy.Tokenizer.v1"

[components]

[components.transformer]
source = "en_core_web_trf"

[components.entity_ruler]
factory = "entity_ruler"
overwrite_ents = true



[components.ner]
@source = "en_core_web_trf"

[components.llm_rel]
@factory = "llm"

[components.llm_rel.task]
@llm_tasks = "spacy.LLM.v1"
task = "relation_extraction"

[components.llm_rel.task.prompt]
@llm_prompts = "spacy.StringPrompt.v1"
prompt = "You are a forensic text analysis expert. Extract semantic relations between entities. Use ONLY this schema: RELATION TYPES: CALLER_OF, REPORTED_AT, LOCATED_AT, DISPATCHED_TO, INVESTIGATED_BY, REPORTS_DISTURBANCE_AT. OUTPUT FORMAT (STRICT JSON): { \"relations\": [{\"head\": \"<canonical_head>\", \"relation\": \"<RELATION>\", \"tail\": \"<canonical_tail>\"}] }. Rules: Use ONLY canonical global entity names provided below. Do NOT invent new entities. Use the text to infer relations. You may output multiple relations. Entities: {entities} Text: {text}"

[components.llm_rel.backend]
@llm_backends = "spacy.REST.v1"
api = "OpenAI"

[components.llm_rel.backend.config]
model = "gpt-4o"
temperature = 0.0
api_key = "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"

[initialize]
vectors = null
before_creation = null
after_creation = null
after_pipeline_creation = null
