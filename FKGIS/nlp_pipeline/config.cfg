[system]
gpu_allocator = null

[nlp]
lang = "en"
pipeline = ["entity_ruler", "ner", "llm"]

[components]

[components.entity_ruler]
factory = "entity_ruler"
overwrite_ents = true
patterns = [{"label":"ROLE","pattern":"Reporting Officer"},{"label":"ROLE","pattern":"Reporting Investigator"},{"label":"ORG","pattern":"Crime Scene Unit"},{"label":"ROLE","pattern":"Coroner's Inspector"},{"label":"ROLE","pattern":"Deputy"},{"label":"PERSON","pattern":"Witness"},{"label":"PERSON","pattern":"Victim"},{"label":"EVIDENCE","pattern":"Body"},{"label":"EVIDENCE","pattern":"Dog"},{"label":"LOC","pattern":"Residence"},{"label":"LOC","pattern":"Scene"}]

[components.ner]
source = "en_core_web_trf"

[components.llm]
factory = "llm"

[components.llm.task]
@llm_tasks = "spacy.LLM.v1"
task = "coref"

[components.llm.task.prompt]
@llm_prompts = "spacy.StringPrompt.v1"
prompt = "You are an expert in forensic text analysis. Identify all coreference clusters in the following text. Coreference clusters are groups of mentions that refer to the same entity, such as people, places, or objects. Focus on entities relevant to crime scenes: victims, officers, suspects, locations, evidence. Output the clusters as a list of lists, where each sublist contains the mention texts that refer to the same entity. Example: [[\"John Doe\", \"he\", \"the victim\"], [\"Crime Scene Unit\", \"the unit\"]]"

[components.llm.backend]
@llm_backends = "spacy.REST.v1"
api = "OpenAI"
config = {"model": "gpt-4o", "temperature": 0.0, "api_key": "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"}
